name: Dictionary Unit Tests

on:
  push:
    branches: [ master, main, testing ]
    paths:
      - 'examples/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'examples/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  # Native (host) Google Test suites. The library is header-only in test mode,
  # so a mock tests/Arduino.h lets it compile off-device. All suites (3.x API
  # compatibility, the 4.0 API under its build flags, the jload parser, a
  # differential test against a reference model with the hash index off/on, the
  # value codec, malloc fault injection, the split-header link test and the
  # deprecation compile checks) are defined in tests/CMakeLists.txt and run via ctest.
  unit-tests:
    name: Unit Tests (Google Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libgtest-dev

      - name: Configure
        run: cmake -S tests -B tests/build

      - name: Build
        run: cmake --build tests/build -j"$(nproc)"

      - name: Run tests
        run: ctest --test-dir tests/build --output-on-failure

  # Same suites rebuilt with AddressSanitizer + UndefinedBehaviorSanitizer to
  # catch invalid frees, use-after-free, leaks and UB, including on the
  # fault-injected error paths.
  unit-tests-sanitized:
    name: Unit Tests (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libgtest-dev

      - name: Configure (sanitized)
        run: cmake -S tests -B tests/build-asan -DDICT_SANITIZE=ON

      - name: Build
        run: cmake --build tests/build-asan -j"$(nproc)"

      - name: Run tests
        run: ctest --test-dir tests/build-asan --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
